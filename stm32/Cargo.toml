[package]
edition = "2024"
name = "embassy-stm32f4-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
# Configured for STM32F411CEU6.
embassy-stm32 = { version = "0.5.0", path = "../../embassy/embassy-stm32", features = [
  "defmt",
  "stm32f411ce",
  "memory-x",
  "time-driver-tim4",
] }
embassy-executor = { version = "0.9.0", path = "../../embassy/embassy-executor", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-time = { version = "0.5.0", path = "../../embassy/embassy-time", features = [
  "defmt",
  "tick-hz-32_768",
] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
